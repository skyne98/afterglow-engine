<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>afterglow · Three.js WebGPU on cef-rs</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0c10; color: #e5e7eb;
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
    #hud { position: fixed; inset: auto 0 0 0; padding: 8px 12px;
      background: rgba(8,10,14,.85); border-top: 1px solid #222; white-space: pre-wrap; z-index: 10; }
    #hud b { color: #7dd3fc; }
    #hud .err { color: #f87171; }
    #hud .ok { color: #4ade80; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">booting Three.js WebGPU…</div>
  <script type="module">
    import * as THREE from './three.webgpu.js';

    const hud = document.getElementById('hud');
    const log = (msg, cls) => {
      console.log('[three] ' + msg); // -> CEF DisplayHandler -> stderr
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      hud.appendChild(span);
    };

    const canvas = document.getElementById('c');

    (async () => {
      log('THREE.REVISION = ' + THREE.REVISION);

      if (!navigator.gpu) { log('navigator.gpu UNDEFINED — no WebGPU.', 'err'); return; }

      // Latest Three.js WebGPU renderer (r185). Auto-uses WebGPU, falls back to WebGL2.
      const renderer = new THREE.WebGPURenderer({ canvas, antialias: true });
      await renderer.init();

      const backend = renderer.backend?.constructor?.name
        ?? renderer.backend?.isWebGPUBackend?.()
        ?? '(unknown)';
      const webgpu = String(backend).includes('WebGPU') || renderer.isWebGPURenderer;
      log('backend = ' + backend + (webgpu ? '  (WebGPU ✓)' : '  (fallback?)'),
          webgpu ? 'ok' : 'err');

      const adapter = renderer.backend?.adapter?.info
        ?? await navigator.gpu.requestAdapter().then(a => a && a.info);
      log('adapter = ' + (adapter ? `${adapter.vendor}/${adapter.architecture}/${adapter.device}` : '(n/a)'), 'ok');

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(2.2, 1.8, 2.6);
      camera.lookAt(0, 0, 0);

      // MeshStandardNodeMaterial exercises the TSL node-material pipeline.
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardNodeMaterial({ color: 0x4ade80, roughness: 0.35, metalness: 0.1 })
      );
      scene.add(mesh);

      const dir = new THREE.DirectionalLight(0xffffff, 2.2);
      dir.position.set(3, 4, 2);
      scene.add(dir);
      scene.add(new THREE.AmbientLight(0x7dd3fc, 0.4));

      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      renderer.setAnimationLoop(() => {
        mesh.rotation.x += 0.006;
        mesh.rotation.y += 0.011;
        renderer.render(scene, camera);
      });

      log('rendering Three.js WebGPU scene ✓', 'ok');
    })().catch(e => log('ERROR: ' + (e?.stack || e), 'err'));
  </script>
</body>
</html>
