# The demo uses imported shared memory and an adaptive tile limit.
# The nearest .cargo/config wins, so this file does not affect engine crates.
[target.wasm32-unknown-unknown]
rustflags = [
  '-C', 'panic=unwind',
  '-C', 'target-feature=+atomics,+bulk-memory,+mutable-globals,+simd128,+exception-handling',
  '-C', 'link-arg=--import-memory',
  '-C', 'link-arg=--max-memory=2147483648',
  '-C', 'link-arg=--shared-memory',
]
