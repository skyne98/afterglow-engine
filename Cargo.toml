[workspace]
resolver = "3"
members = [
    "crates/afterglow-engine",
    "crates/afterglow-lightyear-avian3d",
    "crates/agx",
    "crates/engine-rpg-harness",
    "crates/prototypes/prototype-physics-bench",
    "crates/prototypes/prototype-physics-serialize",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
blake3 = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
bevy = { version = "0.18.1", default-features = true, features = ["webgpu", "jpeg", "png"] }
avian3d = { version = "0.6.1", default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints", "enhanced-determinism", "serialize"] }
leafwing-input-manager = "0.20.0"
lightyear = { version = "0.26.4", default-features = false }
lightyear_transport = "0.26.4"
lightyear_inputs_leafwing = "0.26.4"
afterglow-lightyear-avian3d = { path = "crates/afterglow-lightyear-avian3d" }
wgpu = "27"
wasm-bindgen = "=0.2.117"
web-time = "1"
tiny_http = "0.12"
