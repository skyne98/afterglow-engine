[workspace]
resolver = "2"
members = ["crates/afterglow-cef", "crates/afterglow-engine-core", "crates/latency-tool", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skyne98/afterglow-engine"

[workspace.dependencies]
cef = "149.3"
serde_json = "1"
tungstenite = "0.24"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 2
