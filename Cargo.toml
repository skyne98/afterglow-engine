[workspace]
resolver = "2"
exclude = ["vendor/afterglow-shell-blitz"]
members = [
    "crates/afterglow-audio-worker",
    "crates/afterglow-shell",
    "crates/afterglow-obvhs-tracer",
    "crates/afterglow-assets",
    "crates/afterglow-assets-worker",
    "crates/afterglow-basis-encoder",
    "crates/afterglow-meshopt",
    "crates/afterglow-pipeline",
    "crates/afterglow-rpc",
    "crates/afterglow-rpc-macros",
    "crates/afterglow-rpc-demo",
    "crates/afterglow-texture",
    "crates/afterglow-web",
    "crates/latency-tool",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skyne98/afterglow-engine"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tungstenite = "0.24"
ureq = { version = "2", features = ["json"] }
syn = { version = "2", features = ["full"] }
quote = "1"
async-executor = "1"

# afterglow-shell needs narrow native WebGPU patches plus its pinned Blitz
# browser/layout fixes. Keep these at workspace scope because Cargo ignores
# patch tables in member manifests.
[patch.crates-io]
deno_webgpu = { path = "crates/afterglow-shell/vendor/deno_webgpu" }
naga = { path = "crates/afterglow-shell/vendor/naga" }
wgpu = { path = "crates/afterglow-shell/vendor/wgpu" }
blitz-dom = { path = "vendor/afterglow-shell-blitz/packages/blitz-dom" }
blitz-html = { path = "vendor/afterglow-shell-blitz/packages/blitz-html" }
blitz-paint = { path = "vendor/afterglow-shell-blitz/packages/blitz-paint" }
blitz-traits = { path = "vendor/afterglow-shell-blitz/packages/blitz-traits" }
stylo_taffy = { path = "vendor/afterglow-shell-blitz/packages/stylo_taffy" }
debug_timer = { path = "vendor/afterglow-shell-blitz/packages/debug_timer" }

[profile.release]
opt-level = 2

[profile.release.package.afterglow-audio-worker]
opt-level = 3
codegen-units = 1

[profile.release.package.afterglow-obvhs-tracer]
opt-level = 3
codegen-units = 1

[profile.wasm-dev]
inherits = "dev"
panic = "abort"

[profile.wasm-release]
inherits = "release"
panic = "abort"
opt-level = 2
