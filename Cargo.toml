[workspace]
resolver = "3"
members = [
    "crates/afterglow-engine-macros",
    "crates/afterglow-engine",
    "crates/agx",
    "crates/mock-rpg-network-tests",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
bevy = { version = "0.18.1", default-features = true, features = ["webgpu"] }
avian3d = { version = "0.6.1", default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints", "parallel"] }
wasm-bindgen = "=0.2.117"
web-time = "1"
tiny_http = "0.12"
iroh = "0.98.2"
steamworks = "0.13.1"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
