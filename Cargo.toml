[workspace]
resolver = "2"
members = [
    "crates/afterglow-assets",
    "crates/afterglow-assets-worker",
    "crates/afterglow-basis-encoder",
    "crates/afterglow-cef",
    "crates/afterglow-meshopt",
    "crates/afterglow-pipeline",
    "crates/afterglow-rpc",
    "crates/afterglow-rpc-macros",
    "crates/afterglow-rpc-demo",
    "crates/afterglow-texture",
    "crates/afterglow-web",
    "crates/latency-tool",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skyne98/afterglow-engine"

[workspace.dependencies]
cef = "149.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
tungstenite = "0.24"
ureq = { version = "2", features = ["json"] }
syn = { version = "2", features = ["full"] }
quote = "1"
async-executor = "1"

[profile.release]
opt-level = 2

[profile.wasm-dev]
inherits = "dev"
panic = "abort"

[profile.wasm-release]
inherits = "release"
panic = "abort"
opt-level = 2
