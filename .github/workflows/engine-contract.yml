name: engine-contract

on:
  push:
  pull_request:

jobs:
  sealed-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install authored web dependencies
        run: bun install --cwd crates/afterglow-web/web --frozen-lockfile
      - name: Run the canonical conformance command
        run: cargo run -p xtask -- conformance
      - name: Reject strict TypeScript baseline additions
        env:
          COMPARE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bun scripts/typecheck-ratchet.ts --compare-ref "$COMPARE_REF"
      - name: Reject source-hygiene baseline additions
        env:
          COMPARE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: bun scripts/lint-source-hygiene.ts --compare-ref "$COMPARE_REF"
      - name: Run the canonical test command
        run: cargo run -p xtask -- test
