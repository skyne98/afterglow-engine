name: engine-contract

on:
  push:
  pull_request:

jobs:
  implementation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install authored web dependencies
        run: bun install --cwd crates/afterglow-web/web --frozen-lockfile
      - name: Run conformance, unit, and vertical-integration tests
        run: cargo run -p xtask -- test
