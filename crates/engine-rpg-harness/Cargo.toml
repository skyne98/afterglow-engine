[package]
name = "engine-rpg-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
afterglow-engine = { path = "../afterglow-engine", features = ["multiplayer"] }
afterglow-lightyear-avian3d.workspace = true
bevy.workspace = true
lightyear = { workspace = true, default-features = false, features = ["std", "client", "server", "crossbeam", "udp", "netcode", "replication", "prediction", "interpolation", "frame_interpolation", "leafwing"] }
lightyear_transport = { workspace = true }
lightyear_inputs_leafwing = { workspace = true, features = ["client", "server"] }
leafwing-input-manager.workspace = true
avian3d = { workspace = true }
serde.workspace = true
