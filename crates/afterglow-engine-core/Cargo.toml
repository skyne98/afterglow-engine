[package]
name = "afterglow-engine-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "afterglow engine core — compiles native (CEF host) and WASM (web worker)"

[lib]
crate-type = ["rlib", "cdylib"]   # rlib for native host, cdylib for wasm32

[dependencies]
serde_json.workspace = true

# WASM-only: web worker bindings. Native builds skip this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
