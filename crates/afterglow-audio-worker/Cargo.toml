[package]
name = "afterglow-audio-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
steam-audio = ["dep:afterglow-obvhs-tracer"]

[build-dependencies]
cc = "1.2"

[dependencies]
afterglow-obvhs-tracer = { path = "../afterglow-obvhs-tracer", optional = true }
afterglow-rpc = { path = "../afterglow-rpc" }
afterglow-rpc-macros = { path = "../afterglow-rpc-macros" }
serde.workspace = true

[dev-dependencies]
cpal = "0.16"
