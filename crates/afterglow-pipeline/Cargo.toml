[package]
name = "afterglow-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Offline asset pipeline — preprocess, compress, and package assets for streaming (.big format)"

[[bin]]
name = "afterglow-pipeline"
path = "src/main.rs"

[dependencies]
afterglow-meshopt = { path = "../afterglow-meshopt" }
afterglow-basis-encoder = { path = "../afterglow-basis-encoder" }
postcard.workspace = true
serde.workspace = true
bytemuck = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
