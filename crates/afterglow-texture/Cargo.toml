[package]
name = "afterglow-texture"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Basis Universal texture transcoder + mip generation — pure Rust, no C++"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
afterglow-rpc = { path = "../afterglow-rpc" }
afterglow-rpc-macros = { path = "../afterglow-rpc-macros" }
serde.workspace = true
async-executor.workspace = true
basisu = { git = "https://github.com/JakubValtar/basisu_rs", default-features = false }
