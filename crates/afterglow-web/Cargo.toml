[package]
name = "afterglow-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Web target for afterglow-engine: SharedArrayBuffer-backed shared memory, Web Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
afterglow-rpc = { path = "../afterglow-rpc" }

[[example]]
name = "coep_server"
path = "examples/coep_server.rs"

# The dev server (and therefore `afterglow-assets`) is native-only; keep it
# out of the wasm target so SharedArrayBuffer wasm module stays lean.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
afterglow-assets = { path = "../afterglow-assets" }
