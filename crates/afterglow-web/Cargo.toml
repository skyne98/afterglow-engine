[package]
name = "afterglow-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Web target for afterglow-engine: SharedArrayBuffer-backed shared memory, Web Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
afterglow-rpc = { path = "../afterglow-rpc" }

[[example]]
name = "coep_server"
path = "examples/coep_server.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
