<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>afterglow-engine — LOD Demo</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden}
  canvas{display:block}
  #info{position:fixed;top:8px;left:8px;color:#e5e7eb;font:13px/1.4 ui-monospace,monospace;
    background:rgba(0,0,0,0.7);padding:8px 12px;border-radius:4px;pointer-events:none;z-index:10}
  #loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#e5e7eb;
    font:16px/1.4 ui-monospace,monospace;text-align:center}
</style>
</head>
<body>
<div id="loading">afterglow-engine — spawning meshopt worker...</div>
<div id="info" style="display:none"></div>
<script src="engine-bundle.js"></script>
<script type="module">
import { MeshoptClient } from './meshopt.client.js';

const THREE = window.THREE;
const loadingEl = document.getElementById('loading');
const infoEl = document.getElementById('info');

// --- Three.js setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 12);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.AmbientLight(0x404060, 0.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

// --- Generate a UV sphere mesh ---
function generateSphere(segments, rings) {
  const positions = [];
  const indices = [];
  for (let y = 0; y <= rings; y++) {
    const v = y / rings;
    const phi = v * Math.PI;
    for (let x = 0; x <= segments; x++) {
      const u = x / segments;
      const theta = u * Math.PI * 2;
      positions.push(
        Math.cos(theta) * Math.sin(phi),
        Math.cos(phi),
        Math.sin(theta) * Math.sin(phi)
      );
    }
  }
  for (let y = 0; y < rings; y++) {
    for (let x = 0; x < segments; x++) {
      const i = y * (segments + 1) + x;
      indices.push(i, i + segments + 1, i + 1);
      indices.push(i + 1, i + segments + 1, i + segments + 2);
    }
  }
  return {
    positions: new Float32Array(positions),
    indices: new Uint32Array(indices),
  };
}

// --- Spawn the meshopt worker ---
const client = await MeshoptClient.spawn('meshopt.wasm');
loadingEl.textContent = 'afterglow-engine — generating LOD levels...';

// --- Generate the source mesh ---
const segments = 48, rings = 32;
const { positions, indices } = generateSphere(segments, rings);
const origTris = indices.length / 3;

// --- Generate 4 LOD levels ---
const lodRatios = [1.0, 0.5, 0.25, 0.1];
const lodLabels = ['LOD 0 — Full', 'LOD 1 — 50%', 'LOD 2 — 25%', 'LOD 3 — 10%'];
const lodMeshes = [];

for (let i = 0; i < lodRatios.length; i++) {
  const targetTris = Math.max(4, Math.floor(origTris * lodRatios[i]));
  const targetIndexCount = targetTris * 3;

  client.poll();
  const lodIndices = await client.simplify(
    indices, positions, 12, targetIndexCount, 0.02
  );

  // Build a Three.js geometry from the LOD indices.
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setIndex(new THREE.BufferAttribute(lodIndices, 1));
  geom.computeVertexNormals();

  const tris = lodIndices.length / 3;
  const color = [0x4fc3f7, 0x66bb6a, 0xffa726, 0xef5350][i];

  // Wireframe material — shows triangle density.
  const wireMat = new THREE.MeshBasicMaterial({ color, wireframe: true });
  const solidMat = new THREE.MeshStandardMaterial({
    color, metalness: 0.3, roughness: 0.6, flatShading: true
  });

  // Two meshes per LOD: solid + wireframe overlay.
  const group = new THREE.Group();
  const solid = new THREE.Mesh(geom, solidMat);
  const wire = new THREE.Mesh(geom.clone(), wireMat);
  wire.scale.setScalar(1.001);
  group.add(solid);
  group.add(wire);

  lodMeshes.push({ group, tris, label: lodLabels[i] });
}

// --- Arrange in a 2×2 grid ---
const spacing = 3.5;
const positions_grid = [
  [-spacing, spacing, 0],   // top-left: LOD 0
  [spacing, spacing, 0],    // top-right: LOD 1
  [-spacing, -spacing, 0],  // bottom-left: LOD 2
  [spacing, -spacing, 0],   // bottom-right: LOD 3
];

for (let i = 0; i < lodMeshes.length; i++) {
  const [x, y, z] = positions_grid[i];
  lodMeshes[i].group.position.set(x, y, z);
  scene.add(lodMeshes[i].group);
}

// --- Info overlay ---
function updateInfo() {
  let html = '<b>afterglow-engine — LOD Demo</b><br>';
  html += `Source: UV sphere ${segments}×${rings} — ${origTris} triangles<br>`;
  html += `Worker: meshopt (WASM, async poll model)<br><br>`;
  for (let i = 0; i < lodMeshes.length; i++) {
    const pct = (lodMeshes[i].tris / origTris * 100).toFixed(0);
    html += `${lodLabels[i]}: ${lodMeshes[i].tris} tris (${pct}%)<br>`;
  }
  html += `<br>Press B to benchmark`;
  infoEl.innerHTML = html;
  infoEl.style.display = 'block';
}
updateInfo();
loadingEl.style.display = 'none';

// --- Built-in benchmark (press B) ---
addEventListener('keydown', e => {
  if (e.key !== 'b' && e.key !== 'B') return;
  const t0 = performance.now();
  client.simplify(indices, positions, 12, Math.floor(origTris * 0.1) * 3, 0.02).then(() => {
    client.poll();
    const t1 = performance.now();
    infoEl.innerHTML += `<br><b>Bench:</b> simplify to 10% in ${(t1 - t0).toFixed(1)}ms`;
  });
});

// --- Animation loop ---
const startTime = performance.now();

function animate() {
  const elapsed = (performance.now() - startTime) / 1000;

  // Rotate each LOD group.
  for (const lod of lodMeshes) {
    lod.group.rotation.y = elapsed * 0.3;
  }

  // Camera slowly orbits.
  camera.position.x = Math.cos(elapsed * 0.1) * 12;
  camera.position.z = Math.sin(elapsed * 0.1) * 12;
  camera.position.y = Math.sin(elapsed * 0.15) * 2;
  camera.lookAt(0, 0, 0);

  client.poll();
  renderer.renderAsync(scene, camera);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
console.log('afterglow-engine: LOD demo started');
</script>
</body></html>
