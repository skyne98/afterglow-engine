<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>SAB Stress Test</title>
<style>body{background:#0a0c10;color:#e5e7eb;font:13px/1.4 ui-monospace,monospace;padding:16px}pre{white-space:pre}</style></head>
<body><pre id="out"></pre>
<script type="module">
const out = document.getElementById('out');
const p = m => { out.textContent += m + '\n'; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
p('=== Local same-thread ring-copy microbenchmark (NOT worker RPC) ===\n');
try {
  const memory = new WebAssembly.Memory({ shared: true, initial: 256, maximum: 1024 });
  const { exports: wasm } = await WebAssembly.instantiate(
    await WebAssembly.compile(await (await fetch('afterglow_web.wasm')).arrayBuffer()),
    { env: { memory, notify_worker: () => {} } },
  );
  wasm.init_ring_buffers();
  const scratch = wasm.get_scratch_ptr(), scratchSize = wasm.get_scratch_size();
  p(`scratch=${scratch} size=${scratchSize} ring=${wasm.get_buffer_size()}\n`);
  // Warm tiered JS/Wasm code before measuring; 2000 iterations keeps the
  // sub-microsecond cases above timer noise without making large copies slow.
  new Uint8Array(memory.buffer, scratch, 64).fill(0x5A);
  for (let i = 0; i < 1000; i++) {
    wasm.write_frame(scratch, 64);
    wasm.read_frame(scratch, 64);
    wasm.write_response(scratch, 64);
    wasm.read_response(scratch, 64);
  }
  const SIZES = [64, 256, 1024, 4096, 16384, 65536, 262144], N = 2000;
  const report = (size, dt, factor) =>
    p(`  ${String(size).padStart(6)} B  ${(dt * 1000 / N).toFixed(1).padStart(6)} us  ${(size * N * factor / (dt / 1000 || 1e-9) / 1048576).toFixed(1).padStart(8)} MiB/s`);
  p('--- Direction 1: write + drain (request ring) ---\n  payload   latency   bandwidth');
  for (const size of SIZES) {
    new Uint8Array(memory.buffer, scratch, size).fill(0xAA);
    const t0 = performance.now();
    for (let i = 0; i < N; i++) while (wasm.write_frame(scratch, size) !== 0) wasm.read_frame(scratch, size + 64);
    while (wasm.has_data()) wasm.read_frame(scratch, size + 64);
    report(size, performance.now() - t0, 1);
    await sleep(0);
  }
  p('\n--- Direction 2: write + read response ---\n  payload   latency   bandwidth');
  for (const size of SIZES) {
    new Uint8Array(memory.buffer, scratch, size).fill(0xBB);
    const t0 = performance.now();
    for (let i = 0; i < N; i++) { while (wasm.write_response(scratch, size) !== 0) wasm.read_response(scratch, size + 64); wasm.read_response(scratch, size + 64); }
    report(size, performance.now() - t0, 1);
    await sleep(0);
  }
  p('\n--- Round-trip (request + response) ---\n  payload   latency   bandwidth');
  for (const size of SIZES) {
    new Uint8Array(memory.buffer, scratch, size).fill(0xCC);
    const t0 = performance.now();
    for (let i = 0; i < N; i++) { while (wasm.write_frame(scratch, size) !== 0) {} wasm.read_frame(scratch, size + 64); while (wasm.write_response(scratch, size) !== 0) {} wasm.read_response(scratch, size + 64); }
    report(size, performance.now() - t0, 2);
    await sleep(0);
  }
  p('\nDone');
} catch (e) { p('ERROR: ' + ((e && e.message) || e)); }
</script></body></html>
