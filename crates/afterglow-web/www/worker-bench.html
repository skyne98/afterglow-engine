<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Worker Benchmark</title>
<style>body{background:#0a0c10;color:#e5e7eb;font:13px/1.4 ui-monospace,monospace;padding:16px}pre{white-space:pre}</style>
</head><body><pre id="out"></pre>
<script type="module">
const out = document.getElementById('out');
const p = m => { out.textContent += m + '\n'; console.log('[bench] ' + m); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function main() {
  p('=== Cross-Thread Worker Benchmark (Web Worker + SAB ring buffer) ===\n');

  // Load the main thread wasm (ring buffer exports)
  const mainBytes = await (await fetch('afterglow_web.wasm')).arrayBuffer();
  const mainModule = await WebAssembly.compile(mainBytes);
  const memory = new WebAssembly.Memory({ shared: true, initial: 256, maximum: 1024 });
  const mainInst = await WebAssembly.instantiate(mainModule, { env: { memory } });
  const wasm = mainInst.exports;
  wasm.init_ring_buffers();

  const reqPtr = wasm.get_request_ptr();
  const respPtr = wasm.get_response_ptr();
  const bufSize = wasm.get_buffer_size();
  const free = respPtr + bufSize;
  const scratch = free;      // scratch for writing request payloads
  const readBuf = free + 1048576;  // read buffer for responses
  p(`Ring buffers: req=${reqPtr} resp=${respPtr} size=${bufSize}`);

  // Spawn the Web Worker (own wasm memory, calls wasm_serve_frame)
  p('Spawning Web Worker...');
  const worker = new Worker('worker.js');
  worker.postMessage({
    type: 'init',
    sab: memory.buffer,
    reqBase: reqPtr,
    respBase: respPtr,
    bufSize,
    wasmUrl: 'physics_worker.wasm',  // the rpc-demo wasm (has wasm_serve_frame)
  });
  await new Promise(r => worker.onmessage = (e) => e.data.type === 'ready' && r());
  p('Worker ready (own wasm memory, no allocator conflict)');

  // Start the worker loop
  worker.postMessage({ type: 'run' });

  // The Physics trait: method 0 = step(state: Vec<f32>, dt: f32) -> Vec<f32>
  // Frame format: [method:u32][postcard_encoded_args]
  // We encode: method=0, args=postcard((Vec<f32>, f32))
  // For simplicity, we'll use raw bytes that match the postcard encoding.

  const SIZES = [1, 4, 16, 64, 256, 1024, 4096, 16384]; // f32 count
  const N = 200;

  p('--- Cross-thread round-trip: main → SAB → worker (serve) → SAB → main ---');
  p('  f32 count   payload   latency   bandwidth');

  for (const count of SIZES) {
    // Build a postcard-encoded request: method=0 + postcard(Vec<f32>, f32)
    // Postcard encoding of Vec<f32>: [varint len][f32 data...]
    // Postcard encoding of f32: 4 bytes LE
    const payloadBytes = 4 + 1 + count * 4 + 4; // method(4) + varint_len(1) + data + dt(4)
    const dt = 0.016;

    // Write the frame to the scratch area
    const view = new Uint8Array(memory.buffer, scratch, payloadBytes);
    const dv = new DataView(memory.buffer, scratch, payloadBytes);
    let off = 0;
    // method = 0
    dv.setUint32(off, 0, true); off += 4;
    // postcard varint for Vec length (count)
    // Postcard varint: for values < 251, it's just the byte
    dv.setUint8(off, count & 0xFF); off += 1; // simplified: works for count < 251
    // f32 data
    for (let i = 0; i < count; i++) {
      dv.setFloat32(off, i * 1.0, true); off += 4;
    }
    // dt (f32)
    dv.setFloat32(off, dt, true); off += 4;

    const actualPayload = off;

    // Benchmark: write request, wait for response
    const t0 = performance.now();
    let ok = 0;
    for (let i = 0; i < N; i++) {
      // Write request frame: [len:u32][payload]
      while (wasm.write_frame(scratch, actualPayload) !== 0) {
        // Buffer full — drain response if needed
        if (wasm.has_response()) wasm.read_response(readBuf, 1048576);
      }
      // Notify the worker that a request is available (worker polls with 1ms timeout)
      // No Atomics.notify needed — worker uses Atomics.wait(reqW, 0, w, 1)
      // Wait for response
      let waited = 0;
      while (!wasm.has_response()) {
        waited++;
        if (waited > 1000000) break; // timeout
      }
      if (wasm.has_response()) {
        wasm.read_response(readBuf, 1048576);
        ok++;
      }
    }
    const dt_ms = performance.now() - t0;
    const latUs = ok > 0 ? (dt_ms * 1000) / ok : 0;
    const bytes = count * 4;
    const mbps = ok > 0 ? (bytes * ok * 2) / (dt_ms / 1000) / 1024 / 1024 : 0;
    p(`  ${String(count).padStart(9)}  ${String(bytes).padStart(6)} B  ${latUs.toFixed(1).padStart(6)} µs  ${mbps.toFixed(1).padStart(8)} MB/s`);
    await sleep(0);
  }

  p('\nDone. Worker terminated.');
  worker.terminate();
}

main().catch(e => p('ERROR: ' + e.message + '\n' + e.stack));
</script></body></html>
