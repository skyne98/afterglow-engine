[package]
name = "prototype-physics-lightyear"
version = "0.1.0"
edition = "2024"

[dependencies]
# Intentionally pinned to Avian 0.5 because lightyear_avian3d 0.26.4 depends on it.
bevy = { workspace = true, features = ["bevy_core_pipeline", "bevy_pbr", "x11"] }
avian3d = { version = "0.5", default-features = false, features = ["3d", "f32", "parry-f32", "serialize"] }
lightyear = { workspace = true, default-features = false, features = ["std", "client", "server", "crossbeam", "replication", "prediction", "interpolation", "netcode"] }
lightyear_avian3d = { workspace = true, features = ["3d", "lag_compensation"] }
