[package]
name = "afterglow-rpc-demo"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "afterglow-rpc demo: a Physics worker interface + round-trip test + schema dump"

[dependencies]
afterglow-rpc = { path = "../afterglow-rpc" }
afterglow-rpc-macros = { path = "../afterglow-rpc-macros" }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true

[[bin]]
name = "dump-schema"
path = "src/bin/dump_schema.rs"

[[example]]
name = "bench_rpc"
