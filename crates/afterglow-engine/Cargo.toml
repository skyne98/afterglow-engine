[package]
name = "afterglow-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
multiplayer = ["lightyear"]
lightyear = ["dep:lightyear", "dep:lightyear_transport", "dep:lightyear_inputs_leafwing", "dep:afterglow-lightyear-avian3d", "lightyear/std", "lightyear/client", "lightyear/server", "lightyear/replication", "lightyear/prediction", "lightyear/interpolation", "lightyear/frame_interpolation", "lightyear/leafwing", "lightyear/crossbeam", "lightyear/udp", "lightyear/netcode", "lightyear_inputs_leafwing/client", "lightyear_inputs_leafwing/server"]
test-support = ["dep:wgpu", "multiplayer"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ed25519-dalek.workspace = true
rand_core.workspace = true
postcard.workspace = true
bevy.workspace = true
avian3d.workspace = true
leafwing-input-manager.workspace = true
lightyear = { workspace = true, optional = true }
lightyear_transport = { workspace = true, optional = true }
lightyear_inputs_leafwing = { workspace = true, optional = true }
afterglow-lightyear-avian3d = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[dependencies.web-time]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["bevy_dev_tools", "trace"] }
tiny_http.workspace = true
