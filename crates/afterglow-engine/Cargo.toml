[package]
name = "afterglow-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
test-support = ["dep:wgpu"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy.workspace = true
wgpu = { version = "27", optional = true }

[dependencies.web-time]
workspace = true

[[bench]]
name = "replication"
harness = false

[[bench]]
name = "authority"
harness = false

[[bench]]
name = "prediction"
harness = false

[[bench]]
name = "reconciliation"
harness = false

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "baseline"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["bevy_dev_tools", "trace"] }
tiny_http.workspace = true
