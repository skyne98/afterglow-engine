[package]
name = "afterglow-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
iroh = ["dep:bytes", "dep:iroh", "dep:tokio"]
steam = ["dep:steamworks"]
test-support = ["dep:wgpu"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy.workspace = true
bytes = { workspace = true, optional = true }
iroh = { workspace = true, optional = true }
steamworks = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
wgpu = { version = "27", optional = true }
afterglow-engine-macros = { path = "../afterglow-engine-macros", version = "0.1.0" }

[dependencies.web-time]
workspace = true

[dev-dependencies]
ggrs = "0.12.0"

[[bench]]
name = "replication"
harness = false

[[bench]]
name = "authority"
harness = false

[[bench]]
name = "prediction"
harness = false

[[bench]]
name = "reconciliation"
harness = false

[[bench]]
name = "interpolation"
harness = false

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "rollback"
harness = false

[[bench]]
name = "ggrs"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["bevy_dev_tools", "trace"] }
tiny_http.workspace = true
