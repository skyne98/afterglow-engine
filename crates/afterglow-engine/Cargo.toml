[package]
name = "afterglow-engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
multiplayer = ["lightyear"]
lightyear = ["dep:lightyear", "dep:lightyear_inputs_leafwing", "lightyear/leafwing", "lightyear/crossbeam", "lightyear/udp", "lightyear_inputs_leafwing/client", "lightyear_inputs_leafwing/server"]
test-support = ["dep:wgpu"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bevy.workspace = true
avian3d.workspace = true
leafwing-input-manager.workspace = true
lightyear = { workspace = true, optional = true }
lightyear_inputs_leafwing = { workspace = true, optional = true }
wgpu = { version = "27", optional = true }

[dependencies.web-time]
workspace = true

[[bench]]
name = "persistence_streaming"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["bevy_dev_tools", "trace"] }
tiny_http.workspace = true
